<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>淘股吧摸鱼</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="container">
    <h1>淘股吧摸鱼</h1>
    <div class="status">
      <p class="enabled">✓ 已启用</p>
    </div>
    <div class="features">
      <h2>已启用功能：</h2>
      <ul>
        <li>🚫 隐藏导航栏</li>
        <li>🚫 隐藏标题栏</li>
        <li>🚫 隐藏侧边栏</li>
        <li>👻 透明化图片 (50%)</li>
        <li>📉 缩小图片 (60%)</li>
      </ul>
    </div>
    <div class="toggle">
      <label>
        <input type="checkbox" id="enableToggle" checked>
        <span>启用插件</span>
      </label>
    </div>
    <p class="version">v1.0.0</p>
  </div>
  <script src="popup.js"></script>
</body>
</html>
